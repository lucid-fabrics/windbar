# Windbar CI/CD.
#
#         ┌─> cd-appstore        (only when MARKETING_VERSION changes)
#   ci ───┤
#         └─> cd-github-source ──> cd-github-release
#
# ci runs on every PR and push. The two GitHub jobs run on every push to main, so
# the public repo and the free DMG always match main.
#
# cd-appstore is deliberately NOT on that chain any more, for two reasons. Apple
# caps build uploads per app per day and we burned 21 in one day re-uploading an
# unchanged 1.0.0, which then blocked everything downstream. And every marketing
# version costs a review cycle, so shipping one has to be a decision rather than a
# side effect of merging a README fix.
#
# A release is therefore: bump MARKETING_VERSION in project.yml, merge. To rebuild
# a binary for a version that already has one, run this workflow by hand with
# force_appstore.
#
# NO BINARY IS EVER PUBLISHED TO GITHUB. GitHub receives source and README only.
# The .pkg exists solely inside the runner workspace and is uploaded to Apple.
#
# Everything runs on [hackintosh-ios], the one macOS builder (Proxmox VM 102,
# see RUNBOOK). beeside's iOS pipeline shares it, so concurrent runs queue.
#
# Job-level `if` uses plain comparisons only. Gitea 1.27's scheduler panics on
# failure()/cancelled()/always() at job level and leaves the job stuck "waiting" -
# step-level `if: always()` is fine, which is why the notify steps use it.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_appstore:
        description: 'Upload to App Store Connect even if MARKETING_VERSION is unchanged'
        type: boolean
        default: false

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  NO_COLOR: "1"
  CI: "true"

jobs:
  ci:
    name: 'CI · build + test'
    runs-on: [hackintosh-ios]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump
        run: ./scripts/check-version-bump.sh
        env:
          FORCE_APPSTORE: ${{ github.event.inputs.force_appstore }}

      - name: Build and test
        run: |
          set -eo pipefail
          export RBENV_ROOT="$HOME/.rbenv"
          export RBENV_VERSION="3.3.11"
          export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$HOME/.local/xcodegen/bin:$PATH"
          bundle install --quiet
          bundle exec fastlane mac build_check

  cd-appstore:
    name: 'CD · App Store Connect'
    needs: [ci]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [hackintosh-ios]
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 has to be readable to see whether the version moved.
          fetch-depth: 2

      - name: Does this merge ship a new version?
        id: gate
        run: |
          set -eo pipefail
          read_version() { sed -n 's/.*MARKETING_VERSION: *"\(.*\)".*/\1/p'; }
          CURRENT=$(read_version < project.yml)
          PREVIOUS=$(git show HEAD~1:project.yml 2>/dev/null | read_version || true)

          if [ "${{ github.event.inputs.force_appstore }}" = "true" ]; then
            echo "forced: uploading $CURRENT even though it may already have builds"
            echo "ship=yes" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "version moved ${PREVIOUS:-none} -> $CURRENT, shipping a build"
            echo "ship=yes" >> "$GITHUB_OUTPUT"
          else
            echo "MARKETING_VERSION is still $CURRENT, so there is nothing new to submit."
            echo "Bump it in project.yml to ship, or re-run with force_appstore to rebuild."
            echo "ship=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and upload
        if: steps.gate.outputs.ship == 'yes'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          SIGNING_KEYCHAIN_PASSWORD_SHARED: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD_SHARED }}
          SIGNING_KEYCHAIN_PASSWORD_WINDBAR: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD_WINDBAR }}
          # App Review contact + demo Dreo account. Secrets, not files: this repo is
          # published to GitHub, and demo_password is a live password.
          ASC_REVIEW_FIRST_NAME: ${{ secrets.ASC_REVIEW_FIRST_NAME }}
          ASC_REVIEW_LAST_NAME: ${{ secrets.ASC_REVIEW_LAST_NAME }}
          ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          ASC_REVIEW_DEMO_USER: ${{ secrets.ASC_REVIEW_DEMO_USER }}
          ASC_REVIEW_DEMO_PASSWORD: ${{ secrets.ASC_REVIEW_DEMO_PASSWORD }}
          # Monotonic and unique per run. ASC reports a stale "latest build" while a
          # previous one is still processing, so the build number never comes from Apple.
          CI_PIPELINE_NUMBER: ${{ github.run_number }}
        run: |
          set -eo pipefail
          export RBENV_ROOT="$HOME/.rbenv"
          export RBENV_VERSION="3.3.11"
          export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$HOME/.local/xcodegen/bin:$PATH"

          # Long silent stretches during archive/upload make the runner look hung.
          ( while true; do echo "... building $(date -u +%H:%M:%S) ..."; sleep 30; done ) & HB=$!
          trap 'kill $HB 2>/dev/null' EXIT

          bundle install --quiet
          bundle exec fastlane mac release

      - name: Notify Telegram
        if: always() && steps.gate.outputs.ship == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          if [ "${{ job.status }}" = "success" ]; then TG="✅ uploaded"; else TG="❌ failed"; fi
          MSG=$(printf '🌀 <b>Windbar CD -> App Store Connect</b> - %s\n\n🔖 <code>%s</code>\n🔗 %s' \
            "$TG" "${GITHUB_SHA:0:7}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&disable_web_page_preview=true" \
            --data-urlencode "text=$MSG" || true

  cd-github-source:
    name: 'CD · publish source to GitHub'
    needs: [ci]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [hackintosh-ios]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push source to GitHub
        env:
          # An SSH deploy key scoped to this one GitHub repo, NOT an account token.
          # A token in an https:// remote URL is fragile and dangerous: a single
          # trailing newline in the secret both breaks the URL ("credential url
          # cannot be parsed") and defeats Gitea's log masking, which printed a
          # real token into a job log on 2026-07-30. A key never goes in a URL.
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
          GH_REPO: lucid-fabrics/windbar
        run: |
          set -eo pipefail
          [ -n "$GH_DEPLOY_KEY" ] || { echo "GH_DEPLOY_KEY not set"; exit 1; }

          # Refuse to publish if a build artifact ever entered git. GitHub gets
          # source and README only; binaries are an App Store concern.
          if git ls-files | grep -qiE '\.(dmg|pkg|ipa|app|xcarchive)(/|$)'; then
            echo "Refusing to publish: binary artifacts are tracked in git"
            git ls-files | grep -iE '\.(dmg|pkg|ipa|app|xcarchive)(/|$)'
            exit 1
          fi

          # Same idea for secrets. review_information holds a live Dreo password and
          # personal contact details; it is gitignored and written from secrets at
          # deliver time. If it is ever tracked again, stop before publishing it.
          if git ls-files | grep -qE 'review_information/|\.p12$|\.p8$|\.mobileprovision$|\.provisionprofile$'; then
            echo "Refusing to publish: credential files are tracked in git"
            git ls-files | grep -E 'review_information/|\.p12$|\.p8$|\.mobileprovision$|\.provisionprofile$'
            exit 1
          fi

          KEYDIR=$(mktemp -d)
          trap 'rm -rf "$KEYDIR"' EXIT
          # 0600 before the key is written, and printf so no newline is appended.
          umask 077
          printf '%s\n' "$GH_DEPLOY_KEY" > "$KEYDIR/id_ed25519"
          chmod 600 "$KEYDIR/id_ed25519"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$KEYDIR/known_hosts" 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i $KEYDIR/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$KEYDIR/known_hosts"
          git config user.name  "windbar-ci"
          git config user.email "ci@lucidfabrics.local"
          git remote remove github 2>/dev/null || true
          git remote add github "git@github.com:${GH_REPO}.git"
          git push github "HEAD:refs/heads/main"
          echo "=== published $(git rev-parse --short HEAD) to github.com/${GH_REPO} ==="

  cd-github-release:
    name: 'CD · notarized DMG to GitHub'
    needs: [ci, cd-github-source]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [hackintosh-ios]
    steps:
      - uses: actions/checkout@v4

      - name: Build, notarize and publish the DMG
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          SIGNING_KEYCHAIN_PASSWORD_SHARED: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD_SHARED }}
          SIGNING_KEYCHAIN_PASSWORD_WINDBAR: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD_WINDBAR }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: lucid-fabrics/windbar
          CI_PIPELINE_NUMBER: ${{ github.run_number }}
        run: |
          set -eo pipefail
          export RBENV_ROOT="$HOME/.rbenv"
          export RBENV_VERSION="3.3.11"
          export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$HOME/.local/xcodegen/bin:$PATH"
          [ -n "$GH_RELEASE_TOKEN" ] || { echo "GH_RELEASE_TOKEN not set"; exit 1; }

          # Notarization waits on Apple, so keep the runner looking alive.
          ( while true; do echo "... $(date -u +%H:%M:%S) ..."; sleep 30; done ) & HB=$!
          trap 'kill $HB 2>/dev/null' EXIT

          bundle install --quiet
          bundle exec fastlane mac release_dmg

          VERSION=$(sed -n 's/.*MARKETING_VERSION: *"\(.*\)".*/\1/p' project.yml)
          DMG="build/dmg/Windbar-$VERSION.dmg"
          [ -f "$DMG" ] || { echo "no DMG at $DMG"; exit 1; }

          # Refuse to ship a DMG Gatekeeper would block. Better to fail the job than
          # to publish a download that greets people with "Windbar is damaged".
          xcrun stapler validate "$DMG"

          # Create the release if this version is new, then upload. Re-running the
          # same version replaces the asset rather than erroring.
          API="https://api.github.com/repos/${GH_REPO}"
          AUTH="Authorization: Bearer ${GH_RELEASE_TOKEN}"
          TAG="v$VERSION"

          ID=$(curl -sf -H "$AUTH" "$API/releases/tags/$TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null || true)
          if [ -z "$ID" ]; then
            ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Windbar $VERSION\",\"body\":\"Signed and notarized by Apple. Download the DMG, drag Windbar to Applications, open it.\\n\\nFree. The App Store build is the same app if you would rather get updates automatically.\",\"draft\":false,\"prerelease\":false}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            echo "created release $TAG"
          else
            OLD=$(curl -sf -H "$AUTH" "$API/releases/$ID/assets" \
              | python3 -c "import json,sys; print(next((a['id'] for a in json.load(sys.stdin) if a['name']=='Windbar-$VERSION.dmg'), ''))" || true)
            [ -n "$OLD" ] && curl -sf -X DELETE -H "$AUTH" "$API/releases/assets/$OLD" && echo "replaced existing asset"
          fi

          curl -sf -X POST -H "$AUTH" -H "Content-Type: application/x-apple-diskimage" \
            --data-binary @"$DMG" \
            "https://uploads.github.com/repos/${GH_REPO}/releases/$ID/assets?name=Windbar-$VERSION.dmg" \
            > /dev/null
          echo "=== published $DMG to github.com/${GH_REPO}/releases/tag/$TAG ==="
          echo "=== published $(git rev-parse --short HEAD) to github.com/${GH_REPO} ==="
